name: Release SBOM

# Attach a CycloneDX SBOM (Software Bill of Materials) to each release: the full
# list of pinned dependencies, read from uv.lock, so users can audit what a
# release ships and scan it for known vulnerabilities.
#
# Releases in this repo are immutable: once published, no asset can be added.
# So the SBOM goes onto a *draft*, and a maintainer publishes it afterwards.
# Pushing a version tag creates that draft (with generated notes) or fills a
# draft that already exists for the tag. See docs/release.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag whose draft release gets the SBOM (e.g. v2.5.1)"
        required: true

permissions:
  contents: read

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Create the draft release and upload its assets.
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v5
        with:
          # Catalog the source of the tag, not a branch, so the SBOM reflects
          # exactly what ships.
          ref: refs/tags/${{ env.TAG }}
          # This job only reads the source; keep the token out of .git/config.
          persist-credentials: false

      - name: Check the tag matches the project version
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate SBOM
        # Pinned by commit (v0.24.3); the action wraps Anchore Syft, whose
        # uv.lock cataloger records every locked package, extras included.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-${{ env.VERSION }}.cyclonedx.json
          # Pin Syft so the catalog does not drift between releases.
          syft-version: v1.55.0
          # The step below names and uploads the asset itself.
          upload-release-assets: false
          upload-artifact: false

      - name: Attach SBOM and checksum to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SBOM="sbom-${VERSION}.cyclonedx.json"
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' "$SBOM" > /dev/null
          echo "SBOM lists $(jq '.components | length' "$SBOM") components"
          sha256sum "$SBOM" > "$SBOM.sha256"

          DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          case "$DRAFT" in
            missing)
              gh release create "$TAG" "$SBOM" "$SBOM.sha256" --repo "$GITHUB_REPOSITORY" \
                --draft --verify-tag --title "$TAG" --generate-notes
              echo "::notice::Draft release $TAG created with the SBOM. Edit its notes, then publish it."
              ;;
            true)
              gh release upload "$TAG" "$SBOM" "$SBOM.sha256" --clobber --repo "$GITHUB_REPOSITORY"
              echo "::notice::SBOM attached to draft release $TAG. Publish it when ready."
              ;;
            *)
              echo "::error::Release $TAG is already published, and published releases are immutable: create a new version."
              exit 1
              ;;
          esac
