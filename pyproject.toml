[project]
name = "dna-factory"
version = "2.3.0"
description = "LLM Post-Training Platform by Dnotitia Inc."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate==1.15.0",
    "apache-tvm-ffi==0.1.11",
    "datasets==5.0.1",
    "deepspeed==0.19.6",
    "kernels==0.16.1",
    "liger-kernel==0.8.2",
    "math-verify==0.9.0",
    "peft==0.20.0",
    "pytest==9.1.1",
    "ruff==0.16.7",
    "tilelang==0.1.12",
    "torch==2.13.0",
    "transformers==5.17.0",
    "trl==1.13.0",
    "vllm==0.28.0",
    "wandb==0.30.0",
]

[tool.uv]
package = false

[tool.ruff]
# Pin the target version rather than inferring it from requires-python.
target-version = "py314"

[tool.ruff.lint]
# Ruff's default rules (pyflakes + a pycodestyle subset) plus import sorting, then
# the individual correctness/clarity rules the project has cleaned up and wants to
# stay clean. Without an explicit selection, `ruff check` on the CLI and in CI can
# disagree about which rules apply. These are pinned rule-by-rule rather than by
# family (`SIM`, `TRY`, ...) so that widening stays a deliberate step: adopt a new
# rule and fix its findings in the same change.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "BLE001",  # no blind `except Exception` without an explicit reason
    "PLC0206", # iterate dicts with .items() instead of re-indexing
    "RUF012",  # mutable class attributes need ClassVar
    "RUF059",  # unused unpacked variables
    "RUF100",  # `# noqa` directives that no longer suppress anything
    "SIM102",  # collapse nested ifs
    "TRY004",  # TypeError for invalid types
    "TRY201",  # bare `raise` when re-raising
]

