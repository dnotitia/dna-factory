[project]
name = "dna-factory"
version = "2.8.0"
description = "LLM Post-Training Platform by Dnotitia Inc."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate==1.16.0",
    "apache-tvm-ffi==0.1.11",
    "datasets==5.2.0",
    "deepspeed==0.20.0",
    "inspect-ai==0.3.291",
    "inspect-evals==0.29.0",
    "kernels==0.17.3",
    "liger-kernel==0.8.5",
    "math-verify==0.9.0",
    "peft==0.21.3",
    "pytest==9.2.0",
    "requests==2.34.2",
    "ruff==0.17.5",
    "tilelang==0.1.12",
    "torch==2.14.0",
    "transformers==5.22.1",
    "trl==1.18.1",
    "vllm==0.33.0",
    "wandb==0.31.0",
]

[tool.uv]
package = false
# vllm caps transformers below the core pin (<5.20.0); the override lifts that cap deliberately,
# validated by hand. Any other cap an override lifts fails the tests. Keep in sync with the core
# pins above (testcase/test_dependency_pins.py checks both, and lists the deliberate lifts in
# INTENTIONALLY_LIFTED).
override-dependencies = [
    "transformers==5.22.1",
]

[tool.ruff]
# Pin the target version rather than inferring it from requires-python.
target-version = "py314"

