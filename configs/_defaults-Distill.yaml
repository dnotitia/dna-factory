########################################################
# DO NOT EDIT THIS FILE
# JUST OVERRIDE THESE VALUES IN YOUR CONFIG FILE
########################################################

########################################################
# SCRIPT ARGUMENTS:
########################################################
# Prompt-only dataset. The student generates the completions online and the teacher grades them, so an
# assistant/reference answer is never used (a conversational dataset's last assistant turn is dropped).
dataset_name: trl-lib/ultrafeedback-prompt

########################################################
# TRAINING ARGUMENTS:
########################################################
seed: 42
output_dir: auto  # Auto-generated output directory

log_level: info

# The teacher: the model whose next-token distribution the student is trained to match.
# It MUST share the student's vocabulary — the loss compares full next-token distributions, so training
# stops with an explicit error on a `vocab_size` mismatch. See docs/distillation.md.
teacher_model_name_or_path: dnotitia/Qwen3-1.7B
# teacher_model_revision: null  # Branch/tag/commit of the teacher (defaults to its main revision)

# Which divergence to minimize between the student and the teacher, over the student's own completions:
#   1.0 = reverse KL, KL(student || teacher)  <- on-policy distillation (mode-seeking; the default)
#   0.0 = forward KL, KL(teacher || student)  <- mass-covering
#   0.5 = Jensen-Shannon divergence
# NOTE: unlike GRPO's `beta` (a KL-penalty coefficient against a reference model), this selects the loss
# itself. There is no reference model in distillation.
beta: 1.0

# Sampling temperature for the student's on-policy generation; it also softens the distributions the
# divergence is computed over. 1.0 keeps the student's true policy on-policy.
temperature: 1.0
max_completion_length: 512

# Batch sizing: unlike GRPO there is no `num_generations` divisibility constraint — one completion per prompt
per_device_train_batch_size: 8
gradient_accumulation_steps: 1  # This value must be carefully checked when training with DeepSpeed

# vLLM generation acceleration (colocate mode shares the training GPUs). Distillation keeps the *teacher*
# resident on the same GPUs as well, so leave more headroom than GRPO does (0.3).
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.25

# Like RL, distillation uses a much smaller learning rate than SFT
learning_rate: 1e-6
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
# If you train bigger model, you may need to increase the warmup steps. e.g. 0.05 → 0.1
warmup_steps: 0.05

num_train_epochs: 1
max_steps: -1

# `bf16` and `tf32` are experimental API and are not effective for bfloat16 training
bf16: true  # Should be enabled for DeepSpeed mixed precision training
tf32: false

# Enabling `gradient_checkpointing` will reduce memory usage at the cost of slower training speed.
# `use_liger_kernel: true` swaps the chunked divergence loss for Liger's fused JSD kernel (faster, less
# memory), at the cost of the per-token `entropy` metric. It is kept disabled by default so the reference
# (chunked) loss path is what runs unless you opt in.
gradient_checkpointing: true
use_liger_kernel: false

# Log a sample of (prompt, completion) pairs every `logging_steps` steps, and write them under
# `<output_dir>/completions` — the cheapest way to watch the student drift toward the teacher
log_completions: true
num_completions_to_print: 2

report_to:
  - wandb

# Options for checkpoint saving
save_strategy: steps
save_steps: 0.2  # Save every 0.2 epochs
save_total_limit: 3

do_eval: false

########################################################
# MODEL ARGUMENTS:
########################################################
# The student: the model being trained.
# Please refer to the following URL for modified chat template-based models:
# https://huggingface.co/collections/dnotitia/qwen3-modified-chat-template
model_name_or_path: dnotitia/Qwen3-0.6B
# NOTE: `torch_dtype` has been renamed to `dtype` in newer PyTorch version
dtype: bfloat16
attn_implementation: kernels-community/vllm-flash-attn3

trust_remote_code: false

########################################################
# DATASET MIXTURE ARGUMENTS:
########################################################

# Please refer to the following URL for more information:
# https://github.com/huggingface/trl/pull/3791#issuecomment-3177492252

########################################################
# DNOTITIA DISTILL TRAINER ARGUMENTS:
########################################################
# Print debug input values using the overridden compute_loss() function for the first n batches
debug_first_n_batches: 3
