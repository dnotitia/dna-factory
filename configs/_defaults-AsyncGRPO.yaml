########################################################
# DO NOT EDIT THIS FILE
# JUST OVERRIDE THESE VALUES IN YOUR CONFIG FILE
########################################################

# AsyncGRPO has a separate schema; do not inherit _defaults-GRPO.yaml.
# Reference: https://huggingface.co/docs/trl/async_grpo_trainer

########################################################
# SCRIPT ARGUMENTS:
########################################################
grpo_execution: async
dataset_name: trl-lib/DeepMath-103K

reward_funcs:
  - dna_factory.rewards.safe_accuracy_reward
  - dna_factory.rewards.boxed_match_reward

########################################################
# TRAINING ARGUMENTS:
########################################################
seed: 42
output_dir: auto  # Auto-generated output directory

log_level: info

# AsyncGRPO core arguments
vllm_server_base_url: http://localhost:8000
num_generations: 8
max_completion_length: 2048
temperature: 1.0
epsilon: 0.2
max_inflight_tasks: -1  # if -1, default value will be `max_staleness × per_device_train_batch_size × gradient_accumulation_steps × num_processes`
max_staleness: 4
weight_sync_steps: 1
token_budget: null  # if null, default value will be vllm's `--max-model-len`. Recommended to leave it as null

per_device_train_batch_size: 2
gradient_accumulation_steps: 4

learning_rate: 1.0e-6
lr_scheduler_type: constant

max_steps: 100

bf16: true

gradient_checkpointing: true
use_liger_kernel: false

# Logging backend; per-step metrics go to Weights & Biases (`- none` to disable)
logging_steps: 1
report_to:
  - wandb

# Options for checkpoint saving
save_strategy: steps
save_steps: 50
save_total_limit: 3
ignore_data_skip: true

# Intentionally false: TRL's built-in eval loop (loss on an eval split) is not used.
# dna-factory evaluates real benchmark scores instead — each checkpoint is served with
# vLLM and scored by Inspect AI (`eval_on_checkpoint`, see docs/checkpoint-eval.md).
eval_strategy: 'no'
do_eval: false

########################################################
# MODEL ARGUMENTS:
########################################################
model_name_or_path: dnotitia/Qwen3-0.6B
dtype: bfloat16
# TRL's AsyncGRPOTrainer hardcodes flash-attn3 internally, but that build has no sm100/B200
# kernels; dna_factory/async_grpo.py overrides it so this value (flash-attn2) is actually used.
attn_implementation: kernels-community/flash-attn2
trust_remote_code: false

########################################################
# DNOTITIA TRAINER ARGUMENTS:
########################################################
# Print debug input values using the overridden compute_loss() function for the first n batches
debug_first_n_batches: 0

dynamic_sampling: 'off'  # when AsyncGRPO is used, dynamic sampling must be set off! they are not compatible yet

# Wall-clock checkpointing on top of the step-based saves above; 0/'off' disables it.
periodic_save_seconds: 6h

# Benchmark every checkpoint while training keeps running: serve it with vLLM on
# eval_devices, run each Inspect task against that server, and log the scores to the
# live W&B run on an `eval/step` x-axis, so the eval curves line up with the loss
# curve. Rank 0 only, in a background thread — training never waits — and any eval
# failure is a warning, not a crash. Needs `report_to: [wandb]` to produce curves.
eval_on_checkpoint: false  # master switch
eval_tasks:                # registry names, or local task files (resolved against the repo root)
  # - inspect_evals/mmlu_pro
  # - inspect_evals/gpqa_diamond
  # - evals/kmmlu_pro.py
  - evals/kmmlu_redux.py
eval_devices: "2"          # CUDA_VISIBLE_DEVICES for the eval vLLM server; must match --data-parallel-size below
eval_vllm_args: "--max-model-len 32768 --data-parallel-size 1"  # extra `vllm serve` flags
eval_max_connections: 20   # inspect eval --max-connections
eval_max_tokens: 16000     # inspect eval --max-tokens
