########################################################
# DO NOT EDIT THIS FILE
# JUST OVERRIDE THESE VALUES IN YOUR CONFIG FILE
########################################################

########################################################
# SCRIPT ARGUMENTS:
########################################################
dataset_name: trl-lib/DeepMath-103K  # Prompt-only; `solution` column feeds `accuracy_reward`

# trl.rewards names (zero-arg only) or dotted import paths -- see docs/grpo-rewards.md.
# `accuracy_reward` needs math_verify and returns None (skips the sample) on an unparseable gold
# answer (~16.5% of DeepMath-103K); `boxed_match_reward` scores those by normalized string compare.
reward_funcs:
  - dna_factory.rewards.safe_accuracy_reward
  - dna_factory.rewards.boxed_match_reward

# Optional sequence-classification reward model, prepended to reward_funcs
# reward_model_name_or_path: null

########################################################
# TRAINING ARGUMENTS:
########################################################
seed: 42
output_dir: auto  # Auto-generated output directory

log_level: info

# GRPO core arguments
beta: 0.0  # 0.0 = no reference model created (memory win); > 0 enables the KL penalty
loss_type: dapo  # grpo, dapo, dr_grpo, bnpo, cispo, sapo, luspo, vespo
num_generations: 8  # Completions per prompt; must divide the generation batch size
max_completion_length: 16384  # Too small truncates every completion -> reward 0 -> no gradient
mask_truncated_completions: true  # DAPO overlong filtering: drop capped completions from the loss
temperature: 1.0
epsilon: 0.2
scale_rewards: group
importance_sampling_level: token

per_device_train_batch_size: 2
gradient_accumulation_steps: 4  # Check this value carefully when training with DeepSpeed

# vLLM generation acceleration; colocate mode shares the training GPUs, so keep memory headroom
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.3

learning_rate: 1e-6  # GRPO typically needs a much smaller lr than SFT
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_steps: 0.05  # Bigger models may need more, e.g. 0.1

num_train_epochs: 1
max_steps: 600  # Light default: ~10h at ~1min/step; set -1 for a full epoch

bf16: true  # Should be enabled for DeepSpeed mixed precision training
tf32: false

gradient_checkpointing: true  # Less memory, slower training
use_liger_kernel: false  # Liger GRPO loss path is unverified for the pinned liger-kernel

report_to:  # Use `- wandb` to enable Weights & Biases
  - none

save_strategy: steps
save_steps: 0.2  # Save every 0.2 epochs
save_total_limit: 3

do_eval: false

########################################################
# MODEL ARGUMENTS:
########################################################
# Modified chat-template models: https://huggingface.co/collections/dnotitia/qwen3-modified-chat-template
model_name_or_path: dnotitia/Qwen3-0.6B
dtype: bfloat16  # Renamed from `torch_dtype` in newer PyTorch versions
attn_implementation: sdpa  # vllm-flash-attn3 is faster but has no B200 (sm100) kernels yet

trust_remote_code: false

########################################################
# DATASET MIXTURE ARGUMENTS:
########################################################
# See https://github.com/huggingface/trl/pull/3791#issuecomment-3177492252

########################################################
# DNOTITIA GRPO TRAINER ARGUMENTS:
########################################################
# Print debug input values using the overridden compute_loss() function for the first n batches
debug_first_n_batches: 5

# Prompt groups whose rollouts all scored the same have zero advantage and no gradient.
#   off       train on them as-is (stock TRL)
#   mask      skip their compute (truncate all-dead micro-batches); gradient unchanged while
#             beta=0 and no entropy/router-aux loss is used
#   resample  refill the batch from extra generation rounds; changes the gradient by design,
#             and is not supported with streaming datasets
dynamic_sampling: "off"   # quoted: bare off is a YAML 1.1 boolean
dynamic_sampling_max_rounds: 2

# Wall-clock checkpointing: the Trainer only saves on step counts, so this sets
# should_save every N seconds and the normal save path (save_total_limit rotation
# included) handles the rest. 0 disables it. save_steps above stays as a coarse backstop.
periodic_save_seconds: 21600  # save every 6 hours
