# Smoke-test SDFT config: the student is distilled toward itself-with-a-hint on `trl-lib/ultrafeedback-prompt`.
model_name_or_path: dnotitia/Qwen3-0.6B

run_name: qwen3-0.6B-sdft

datasets:
  - path: trl-lib/ultrafeedback-prompt
    split: train
    columns: [prompt]
    privileged_context: Answer helpfully and concisely, in at most five sentences.

teacher_context_placement: user
max_completion_length: 512
per_device_train_batch_size: 8
