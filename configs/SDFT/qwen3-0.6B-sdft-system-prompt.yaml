# Context distillation: bake a system prompt into the weights.
#   - rows from the first dataset get the system prompt as the teacher's privileged context
#   - rows from the second dataset have no context: anchor rows (teacher = plain frozen model), which keep
#     the model's behavior on general prompts from drifting
model_name_or_path: dnotitia/Qwen3-0.6B

run_name: qwen3-0.6B-sdft-system-prompt

datasets:
  - path: trl-lib/ultrafeedback-prompt
    split: train
    columns: [prompt]
    weight: 0.1
    privileged_context: |-
      You are a concise assistant. Answer in plain language, in at most five sentences, and ask one short
      clarifying question when the request is ambiguous.
    # For a long prompt: privileged_context_file: path/to/system_prompt.txt
  - path: HuggingFaceH4/ultrachat_200k
    split: train_sft
    columns: [messages]
    weight: 0.05

# The teacher sees the context as a system message, like a deployed system prompt
teacher_context_placement: system

# Compare the student against the teacher on full-vocabulary logits (exact, more memory)
# distillation_mode: full_logits

max_completion_length: 512
per_device_train_batch_size: 8
