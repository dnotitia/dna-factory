########################################################
# DO NOT EDIT THIS FILE
# JUST OVERRIDE THESE VALUES IN YOUR CONFIG FILE
########################################################

########################################################
# SCRIPT ARGUMENTS:
########################################################
# Prompt data. Each row needs a `prompt` (or `messages`, whose last assistant turn is dropped) and optionally a
# `privileged_context`: text the teacher sees but the student does not. Rows without one are anchor rows (teacher
# prompt = student prompt), which teach nothing on their own. See docs/sdft.md.
#
# Default, as in the SDFT paper: GSM8K, where the teacher sees the reference solution next to the question and
# the student sees only the question. `datasets:` takes precedence over `dataset_name`, so to train on other data,
# set `datasets:` in your config.
datasets:
  - path: openai/gsm8k
    name: main
    split: train
    columns: [question, answer]
    prompt_column: question              # student prompt; a string becomes one user turn
    privileged_context_column: answer    # teacher-only demonstration, different on every row

########################################################
# TRAINING ARGUMENTS:
########################################################
seed: 42
output_dir: auto  # Auto-generated output directory

log_level: info

# The teacher is the model itself, so there is no teacher model argument:
#   base = a frozen copy of the initial student (with LoRA: the same weights with the adapter disabled)
#   live = the current student   |   ema = a moving average of the student
teacher_model_kind: base

# How the privileged context joins the student prompt in the teacher prompt (with teacher_context_placement: user).
# Must keep both placeholders; this wording fits the GSM8K default above.
teacher_prompt_template: "{prompt}\n\nHere is a reference solution to this problem:\n{privileged_context}\n\nNow solve the problem yourself."

# Divergence between teacher and student over the student's own samples. `topk_logits` is the SDFT default
# (top-k approximation, cheap); `full_logits` is exact over the full vocabulary; `sampled_token` is per-token
# reverse KL on the sampled ids (needs distillation_alpha: 1.0).
distillation_mode: topk_logits
distillation_topk: 100
distillation_alpha: 0.5  # 0 = forward KL, 1 = reverse KL, 0.5 = JSD

# Drop the first N completion tokens from the loss, to keep the teacher's reaction to its extra context
# (e.g. "As instructed, ...") out of the student.
num_loss_tokens_to_skip: 0

# Sampling for the student's on-policy completions. Context distillation usually wants one sample per prompt.
temperature: 1.0
max_prompt_length: 1024
max_completion_length: 512
num_generations: 1

# `generation_batch_size` (= per_device_train_batch_size x num_processes x gradient_accumulation_steps) must be
# divisible by `num_generations`.
per_device_train_batch_size: 8
gradient_accumulation_steps: 1  # This value must be carefully checked when training with DeepSpeed

# vLLM generation acceleration (colocate mode shares the training GPUs). The frozen teacher copy also stays
# resident, so leave headroom.
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.25

# Like RL and OPD, SDFT uses a much smaller learning rate than SFT
learning_rate: 1e-5
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_steps: 0.05

num_train_epochs: 1
max_steps: -1

# `bf16` and `tf32` are experimental API and are not effective for bfloat16 training
bf16: true  # Should be enabled for DeepSpeed mixed precision training
tf32: false

gradient_checkpointing: true

# Logging backend; per-step metrics go to Weights & Biases (`- none` to disable)
logging_steps: 1
report_to:
  - wandb

# Options for checkpoint saving
save_strategy: "no"  # Step-based saves off; PeriodicCheckpointCallback below is the only checkpoint source
save_total_limit: 3

# Intentionally false: TRL's built-in eval loop (loss on an eval split) is not used.
# dna-factory evaluates real benchmark scores instead — each checkpoint is served with
# vLLM and scored by Inspect AI (`eval_on_checkpoint`, see docs/checkpoint-eval.md).
do_eval: false

########################################################
# MODEL ARGUMENTS:
########################################################
model_name_or_path: dnotitia/Qwen3-0.6B
dtype: bfloat16
# NOTE: FA2 kernels are already built for B200 (sm100), unlike `kernels-community/vllm-flash-attn3`
attn_implementation: kernels-community/flash-attn2

trust_remote_code: false

########################################################
# DATASET MIXTURE ARGUMENTS:
########################################################
# datasets:
#   - path: <hub id or local path>
#     split: train
#     columns: [prompt]
#     weight: 1.0                     # size multiplier (see docs/dataset-mixture.md)
#     privileged_context: "..."       # what the teacher sees on every row of this dataset (omit = anchor rows)
#     # privileged_context_file: path/to/system_prompt.txt   # same, read from a file

########################################################
# DNOTITIA TRAINER ARGUMENTS:
########################################################
# Print debug input values (student prompt, teacher prompt, completion) for the first n batches
debug_first_n_batches: 3

# Where the teacher sees the privileged context: `user` appends it to the last user turn (TRL's default,
# formatted by `teacher_prompt_template`); `system` puts it in a system message, as a deployed system prompt.
teacher_context_placement: user

# Wall-clock checkpointing: see _defaults-OPD.yaml. 0/'off' disables it.
periodic_save_seconds: 6h

# Benchmark every checkpoint while training keeps running: serve it with vLLM on
# eval_devices, run each Inspect task against that server, and log the scores to the
# live W&B run on an `eval/step` x-axis, so the eval curves line up with the loss
# curve. Rank 0 only, in a background thread — training never waits — and any eval
# failure is a warning, not a crash. Needs `report_to: [wandb]` to produce curves.
eval_on_checkpoint: false  # master switch
eval_tasks:                # registry names, or local task files (resolved against the repo root)
  # - inspect_evals/mmlu_pro
  # - inspect_evals/gpqa_diamond
  # - evals/kmmlu_pro.py
  - evals/kmmlu_redux.py
eval_devices: "1"          # CUDA_VISIBLE_DEVICES for the eval vLLM server; must match --data-parallel-size below
eval_vllm_args: "--max-model-len 32768 --data-parallel-size 1"  # extra `vllm serve` flags
eval_max_connections: 20   # inspect eval --max-connections
eval_max_tokens: 16000     # inspect eval --max-tokens
