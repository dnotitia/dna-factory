########################################################
# DO NOT EDIT THIS FILE
# JUST OVERRIDE THESE VALUES IN YOUR CONFIG FILE
########################################################

########################################################
# SCRIPT ARGUMENTS:
########################################################
dataset_name: trl-lib/ultrafeedback_binarized

########################################################
# TRAINING ARGUMENTS:
########################################################
seed: 42
output_dir: auto  # Auto-generated output directory

max_length: 1024
# To use padding_free, `per_device_train_batch_size` must be >= 2 and `attn_implementation` must be set to `flash_attention_2`
padding_free: false

gradient_accumulation_steps: 8  # This value must be carefully checked when training with DeepSpeed
per_device_train_batch_size: 1

log_level: info

# DPO uses `sigmoid` loss by default 
# (DPO loss type: sigmoid, robust, exo_pair, hinge, ipo, bco_pair, sppo_hard, nca_pair, aot_pair, aot, apo_zero, apo_down, discopop)
loss_type: sigmoid

# DPO typically uses a much smaller learning rate compared to SFT
learning_rate: 1e-6
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
# If you train bigger model, you may need to increase the warmup steps. e.g. 0.05 → 0.1
warmup_steps: 0.05

num_train_epochs: 1
max_steps: -1

# `bf16` and `tf32` are experimental API and are not effective for bfloat16 training
bf16: true  # Should be enabled for DeepSpeed mixed precision training
tf32: false

# Enabling `gradient_checkpointing` and `use_liger_kernel` will reduce memory usage at the cost of slower training speed
gradient_checkpointing: true
use_liger_kernel: true

report_to:
  - wandb

# Options for checkpoint saving
save_strategy: steps
save_steps: 0.2  # Save every 0.2 epochs
save_total_limit: 3

do_eval: false

########################################################
# MODEL ARGUMENTS:
########################################################
# Please refer to the following URL for modified chat template-based models:
# https://huggingface.co/collections/dnotitia/qwen3-modified-chat-template
model_name_or_path: dnotitia/Qwen3-0.6B
# NOTE: `torch_dtype` has been renamed to `dtype` in newer PyTorch version
dtype: bfloat16
# NOTE: `kernels-community/vllm-flash-attn3` is faster, but its kernels are not yet built for B200 (sm100)
attn_implementation: sdpa

# trust_remote_code: false

########################################################
# DATASET MIXTURE ARGUMENTS:
########################################################

# Please refer to the following URL for more information:
# https://github.com/huggingface/trl/pull/3791#issuecomment-3177492252

########################################################
# DNOTITIA SFT TRAINER ARGUMENTS:
########################################################
# Print debug input values using the overridden compute_loss() function for the first n batches
debug_first_n_batches: 3
